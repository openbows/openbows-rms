services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openbows_rms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_DSN: "host=postgres user=postgres password=postgres dbname=openbows_rms port=5432 sslmode=disable TimeZone=Asia/Shanghai"
      JWT_SECRET: "dev-secret-change-me"
      JWT_EXPIRE_HOURS: "72"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
